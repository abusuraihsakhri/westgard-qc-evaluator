services:
  westgard-qc-evaluator:
    build: .
    container_name: westgard-qc-evaluator
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:?Set AUDIT_SECRET_KEY in the environment}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
