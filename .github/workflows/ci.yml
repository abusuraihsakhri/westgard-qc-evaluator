name: Westgard QC CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e '.[test]'

    - name: Run Pytest Suite
      run: |
        python -m pytest -v

    - name: Validate JavaScript and run browser rule tests
      run: |
        node --check web/qc.js
        node --check web/app.js
        node --test web/test-qc.cjs

    - name: Package and code sanity checks
      run: |
        python -m pip check
        python -m compileall -q westgard_qc.py agents cli.py enrichment.py simulator.py

    - name: Audit-chain integrity smoke test
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
